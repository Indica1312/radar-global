<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar Global</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#101010;
color:white;
height:100vh;
overflow:hidden;
}

header{
height:70px;
background:#161616;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #2d2d2d;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.radar{
width:20px;
height:20px;
background:#00ff88;
border-radius:50%;
box-shadow:0 0 15px #00ff88;
}

.logo h1{
font-size:22px;
color:#00bfff;
}

.container{
display:flex;
height:calc(100vh - 70px);
}

.sidebar{
width:350px;
background:#171717;
overflow-y:auto;
padding:20px;
border-right:1px solid #2a2a2a;
}

.sidebar h2{
margin-bottom:15px;
color:#00bfff;
}

.conflict{
background:#222;
padding:15px;
margin-bottom:15px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.conflict:hover{
background:#2c2c2c;
}

.red{
border-left:5px solid red;
}

.orange{
border-left:5px solid orange;
}

.yellow{
border-left:5px solid yellow;
}

.map-container{
flex:1;
position:relative;
}

#map{
height:100%;
width:100%;
}

.info-box{
position:absolute;
bottom:20px;
right:20px;
background:rgba(20,20,20,.95);
padding:15px;
border-radius:10px;
max-width:320px;
border:1px solid #333;
}

.info-box h3{
color:#00bfff;
margin-bottom:10px;
}

@media(max-width:900px){
